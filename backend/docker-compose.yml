# Base configuration - merge with docker-compose.prod.yml or docker-compose.staging.yml
# Usage: ./deploy.sh prod up -d  OR  ./deploy.sh staging up -d

# Docker never trims a container's json log file. The api's dies with its container on every deploy, but
# postgres lives across them, so uncapped its file grows for the life of the server.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL database, accessible via localhost only
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: mathcomps
      POSTGRES_USER: mathcomps
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in .env}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathcomps"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A minute of grace: a first initdb or a recovery on a large database outlasts the retries above, and
      # compose fails the whole up the moment a dependency reports unhealthy.
      start_period: 60s

  # One-shot: applies pending EF Core migrations against postgres, then exits.
  # Reuses the API image and runs the baked-in migration bundle.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: mathcomps-api
    restart: "no"
    logging: *default-logging
    entrypoint: ["./efbundle"]
    # efbundle reads its connection string from this env var.
    # Command Timeout=300 keeps long index builds from aborting at the 30s default.
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=mathcomps;Username=mathcomps;Password=${DB_PASSWORD:?set it in .env};Command Timeout=300
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # .NET API - communicates with postgres via internal network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mathcomps-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      ASPNETCORE_URLS: http://+:8080
      # One JSON object per log entry, its scopes included
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Database=mathcomps;Username=mathcomps;Password=${DB_PASSWORD:?set it in .env}
      Authentication__Clerk__Authority: ${CLERK_AUTHORITY:?set it in .env}
      Clerk__SecretKey: ${CLERK_SECRET_KEY:?set it in .env}
      Clerk__WebhookSecret: ${CLERK_WEBHOOK_SECRET:?set it in .env}
      Llm__ApiKey: ${LLM_API_KEY:?set it in .env}
      Sentry__Dsn: ${SENTRY_DSN:-}
      Mail__ResendApiKey: ${RESEND_API_KEY:-}
      # Read-only access to the bucket the handouts CLI publishes the examiner's problem content to.
      CloudflareR2__AccountId: ${R2_ACCOUNT_ID:?set it in .env}
      CloudflareR2__BucketName: ${R2_BUCKET_NAME:?set it in .env}
      CloudflareR2__AccessKeyId: ${R2_ACCESS_KEY_ID:?set it in .env}
      CloudflareR2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:?set it in .env}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik-public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Vector, which keeps every container's logs and the host's metrics, as vector/vector.yaml sets out
  vector:
    image: timberio/vector:0.60.0-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Vector fills the variables in vector.yaml only with this on
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"

      # Reloads vector.yaml when it changes
      VECTOR_WATCH_CONFIG: "true"

      # Where the host's metrics are read from, the host's own /proc and /sys mounted below
      PROCFS_ROOT: /host/proc
      SYSFS_ROOT: /host/sys

      BETTER_STACK_SOURCE_TOKEN: ${BETTER_STACK_SOURCE_TOKEN:?set it in .env}
      BETTER_STACK_INGESTING_HOST: ${BETTER_STACK_INGESTING_HOST:?set it in .env}
    volumes:
      # The folder rather than the file, so a deploy's new vector.yaml reaches the running container, which then
      # reloads it
      - ./vector:/etc/vector:ro

      # The daily files
      - /var/log/mathcomps:/var/log/mathcomps

      # Every container's logs
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # The host's own /proc and /sys
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # Vector never deletes the daily log folders it writes, so this removes those older than 30 days, once a day
  log-cleanup:
    image: alpine:3.24
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /var/log/mathcomps:/var/log/mathcomps
    command:
      - sh
      - -c
      - while true; do find /var/log/mathcomps -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +; sleep 86400; done

networks:
  internal:
    driver: bridge
  # Shared network with Traefik - external so both stacks can use it
  traefik-public:
    external: true
