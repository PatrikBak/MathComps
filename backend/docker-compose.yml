# Base configuration - merge with docker-compose.prod.yml or docker-compose.staging.yml
# Usage: ./deploy.sh prod up -d  OR  ./deploy.sh staging up -d

services:
  # PostgreSQL database, accessible via localhost only
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mathcomps
      POSTGRES_USER: mathcomps
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathcomps"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending EF Core migrations against postgres, then exits.
  # Reuses the API image and runs the baked-in migration bundle.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: mathcomps-api
    restart: "no"
    entrypoint: ["./efbundle"]
    # efbundle reads its connection string from this env var.
    # Command Timeout=300 keeps long index builds from aborting at the 30s default.
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Database=mathcomps;Username=mathcomps;Password=${DB_PASSWORD};Command Timeout=300
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # .NET API - communicates with postgres via internal network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mathcomps-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=mathcomps;Username=mathcomps;Password=${DB_PASSWORD}
      Authentication__Clerk__Authority: ${CLERK_AUTHORITY}
      Clerk__SecretKey: ${CLERK_SECRET_KEY}
      Clerk__WebhookSecret: ${CLERK_WEBHOOK_SECRET}
      Llm__ApiKey: ${LLM_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik-public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  internal:
    driver: bridge
  # Shared network with Traefik - external so both stacks can use it
  traefik-public:
    external: true
