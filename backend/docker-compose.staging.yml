name: mathcomps-staging

# Staging-specific overrides

services:
  postgres:
    ports:
      # Use port 5433 to avoid conflict with prod (which uses 5432)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data

  # Env-specific image tag so prod and staging don't clobber each other on a shared host.
  migrate:
    image: mathcomps-api:staging

  api:
    image: mathcomps-api:staging
    # Gitignored staging config overrides, layered on the baked-in base appsettings*.json: change a value
    # with a restart, no rebuild. See backend/README.md's "Config overrides".
    volumes:
      - ./src/MathComps.Api/appsettings.Staging.json:/app/appsettings.Staging.json:ro
      - ./src/MathComps.Infrastructure/appsettings.examiner.Staging.json:/app/appsettings.examiner.Staging.json:ro
      - ./src/MathComps.Infrastructure/appsettings.llm.Staging.json:/app/appsettings.llm.Staging.json:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mathcomps-staging.rule=Host(`${DOMAIN:?set it in .env.staging}`)"
      - "traefik.http.routers.mathcomps-staging.entrypoints=websecure"
      - "traefik.http.routers.mathcomps-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.mathcomps-staging.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"

volumes:
  postgres_data_staging:
    external: true
