name: mathcomps-prod

# Production-specific overrides

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # Env-specific image tag so prod and staging don't clobber each other on a shared host.
  migrate:
    image: mathcomps-api:prod

  api:
    image: mathcomps-api:prod
    # Gitignored prod config overrides, layered on the baked-in base appsettings*.json: change a value with
    # a restart, no rebuild. See backend/README.md's "Config overrides".
    volumes:
      - ./src/MathComps.Api/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ./src/MathComps.Infrastructure/appsettings.examiner.Production.json:/app/appsettings.examiner.Production.json:ro
      - ./src/MathComps.Infrastructure/appsettings.llm.Production.json:/app/appsettings.llm.Production.json:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mathcomps-prod.rule=Host(`${DOMAIN:?set it in .env.prod}`)"
      - "traefik.http.routers.mathcomps-prod.entrypoints=websecure"
      - "traefik.http.routers.mathcomps-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.mathcomps-prod.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"

volumes:
  postgres_data_prod:
    external: true
