# The read-only gate. It lets in one user, the read-only role, and refuses any other here, before Postgres sees
# it, whatever password it brings.

[databases]
# The one database the gate serves. A client asking for any other is refused.
mathcomps = host=postgres port=5432 dbname=mathcomps

[pgbouncer]
# Every interface of the container. Outside the stack's own network, only the box's loopback reaches it.
listen_addr = 0.0.0.0
listen_port = 6432

# auth_file is the whole list of who may log in: the one user the container's DB_USER and DB_PASSWORD name.
# Keep it the only source. An auth_user makes pgbouncer look up any user missing from the file in Postgres,
# which is how other roles would get in.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# A client keeps its server connection for the whole session, so psql's session commands behave as they do
# against Postgres directly.
pool_mode = session

# JDBC clients such as DBeaver send this on connect, and pgbouncer refuses a parameter it doesn't know
ignore_startup_parameters = extra_float_digits
