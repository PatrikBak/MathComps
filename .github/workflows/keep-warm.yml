name: Keep Netlify Warm

# Run every 5 minutes to prevent cold starts
on:
  schedule:
    - cron: "*/5 * * * *"
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site to keep functions warm
        run: |
          echo "Pinging mathcomps.fun..."
          curl -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" https://mathcomps.fun
