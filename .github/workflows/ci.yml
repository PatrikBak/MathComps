name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run ci

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      - run: dotnet restore backend/MathComps.sln
      - run: dotnet format backend/MathComps.sln --verify-no-changes --no-restore
      - run: dotnet build backend/MathComps.sln --configuration Release --no-restore
      - run: dotnet test backend/MathComps.sln --configuration Release --no-build

      - name: Restore EF Core tools
        working-directory: backend
        run: dotnet tool restore

      - name: Verify no pending model changes (scaffold a migration locally if this fails)
        working-directory: backend
        # Placeholder connection string only lets the factory build the model; this never connects.
        env:
          ConnectionStrings__DefaultConnection: Host=ci;Database=ci;Username=ci;Password=ci
        run: dotnet ef migrations has-pending-model-changes --project src/MathComps.Infrastructure/MathComps.Infrastructure.csproj --startup-project src/MathComps.Infrastructure/MathComps.Infrastructure.csproj

      - name: Regenerate archive JSON
        working-directory: backend/src/MathComps.Cli.SkmoParser
        run: dotnet run --configuration Release --no-build

      - name: Verify archive JSON unchanged (run SkmoParser locally if this fails)
        run: |
          git add data/skmo/archive.parsed.json
          git diff --staged --exit-code

      - name: Regenerate handout JSONs
        working-directory: backend/src/MathComps.Cli.Handouts
        # --skip-asy/compile/upload: Hard to ensure in CI, the author better run the CLI manually 😬
        run: dotnet run --configuration Release --no-build -- --skip-compile --skip-upload --skip-asy '*.sk.tex' '*.en.tex' '*.cs.tex'

      - name: Verify handout skeletons and JSONs unchanged (run Handouts CLI locally if this fails)
        run: |
          git add data/handouts/ web/src/content/handouts/
          git diff --staged --exit-code

  # ReSharper static analysis. main sits at a zero-finding baseline, so any finding here is new.
  # Clear it by fixing the code, or — for a genuine tool blind spot — `// ReSharper disable once <RULE>`
  # with a one-line reason. The jb version is pinned in backend/.config/dotnet-tools.json.
  inspect:
    name: Inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      - run: dotnet restore backend/MathComps.sln

      - name: Restore tools (jb)
        working-directory: backend
        run: dotnet tool restore

      - name: Run inspectcode
        working-directory: backend
        # No --no-build: inspectcode restores and builds the solution itself, matching the local baseline.
        run: dotnet jb inspectcode MathComps.sln --output=inspect.sarif --format=Sarif

      - name: Fail on any finding
        run: |
          count=$(jq '[.runs[].results[]] | length' backend/inspect.sarif)
          echo "inspectcode findings: $count"
          if [ "$count" -ne 0 ]; then
            jq -r '.runs[].results[] | "::error::\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?")"' backend/inspect.sarif
            exit 1
          fi
