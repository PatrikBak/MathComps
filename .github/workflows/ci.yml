name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Install exactly what the lockfile pins
      - run: npm ci

      # Types, lint, formatting, knip, the content validators, vitest, then a production build
      - run: npm run ci

  # The browser suite, which drives the built app with every backend call answered by a stub. Nothing
  # here needs an API or a database; a call no stub answers fails its test by name.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Both projects need these: the token that gets an automated browser past Clerk's bot check is
      # minted once for the whole run, and tests in either project sign the test account in for real.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Install exactly what the lockfile pins
      - run: npm ci

      # Which browser build the install below would fetch, so the cache can be keyed on it rather than
      # on the lockfile, where every unrelated bump would miss and pull Chromium down again
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium alone: it is the only browser the suite declares
      - run: npx playwright install --with-deps chromium

      # What the tests run against, since the config serves the built app rather than a dev server here
      - run: npm run build

      - run: npm run e2e

      # The trace and the page snapshot behind a failure, which the log alone does not carry
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      # Pull the packages down once for the whole job
      - run: dotnet restore backend/MathComps.sln

      # Compile everything, warnings-as-errors
      - run: dotnet build backend/MathComps.sln --configuration Release --no-restore

      # Every test project, against the binaries just built
      - run: dotnet test backend/MathComps.sln --configuration Release --no-build

      - name: Restore EF Core tools
        working-directory: backend
        run: dotnet tool restore

      - name: Verify no pending model changes (scaffold a migration locally if this fails)
        working-directory: backend
        # Placeholder connection string only lets the factory build the model; this never connects.
        env:
          ConnectionStrings__DefaultConnection: Host=ci;Database=ci;Username=ci;Password=ci
        run: dotnet ef migrations has-pending-model-changes --project src/MathComps.Infrastructure/MathComps.Infrastructure.csproj --startup-project src/MathComps.Infrastructure/MathComps.Infrastructure.csproj

      - name: Regenerate handout JSONs
        working-directory: backend/src/MathComps.Cli.Handouts
        # --skip-asy/compile/upload: Hard to ensure in CI, the author better run the CLI manually 😬
        # --skip-derived: both generators need web/ deps this job never installs; the frontend job's
        # handouts:validate check verifies the committed index's freshness independently.
        run: dotnet run --configuration Release --no-build -- --skip-compile --skip-upload --skip-asy --skip-derived '*.sk.tex' '*.en.tex' '*.cs.tex'

      - name: Verify handout skeletons and JSONs unchanged (run Handouts CLI locally if this fails)
        run: |
          git add data/handouts/ web/src/content/handouts/
          git diff --staged --exit-code

  # The backend's static gates: formatting, then ReSharper analysis. main sits at a zero-finding inspectcode
  # baseline, so any finding there is new.
  # Clear it by fixing the code, or — for a genuine tool blind spot — `// ReSharper disable once <RULE>`
  # with a one-line reason. The jb version is pinned in backend/.config/dotnet-tools.json.
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Directory.Packages.props

      # Pull the packages down once for the whole job
      - run: dotnet restore backend/MathComps.sln

      # Fail on anything the formatter would rewrite
      - run: dotnet format backend/MathComps.sln --verify-no-changes --no-restore

      - name: Restore tools (jb)
        working-directory: backend
        run: dotnet tool restore

      - name: Run inspectcode
        working-directory: backend
        # --no-build: the restore above is all inspectcode needs, and the finding set is the same
        # whether the solution gets built first or only restored.
        run: dotnet jb inspectcode MathComps.sln --no-build --output=inspect.sarif --format=Sarif

      - name: Fail on any finding
        run: |
          count=$(jq '[.runs[].results[]] | length' backend/inspect.sarif)
          echo "inspectcode findings: $count"
          if [ "$count" -ne 0 ]; then
            jq -r '.runs[].results[] | "::error::\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?")"' backend/inspect.sarif
            exit 1
          fi
